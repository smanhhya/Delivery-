name: Build & Auto-Release Sman Driver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Unified Signing Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android
          if [ ! -f "driver-debug.keystore" ]; then
            gh release download signing-key-vault -p "driver-debug.keystore" --clobber 2>/dev/null || true
          fi
          if [ ! -f "driver-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore driver-debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            gh release create signing-key-vault driver-debug.keystore \
              --title "Driver Signing Keystore Vault" \
              --notes "مفتاح توقيع تطبيق المندوب الدائم - لا تحذف هذا الإصدار" 2>/dev/null || \
            gh release upload signing-key-vault driver-debug.keystore --clobber 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add driver-debug.keystore
            git commit -m "chore: add persistent driver signing keystore [skip ci]" || true
            git push || true
          fi
          cp -f driver-debug.keystore ~/.android/debug.keystore
          echo "=== Keystore SHA-256 Fingerprint ==="
          keytool -list -v -keystore driver-debug.keystore -alias androiddebugkey -storepass android | grep "SHA256:" || true

      - name: Prepare Web Files & Capacitor Config
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp -f index.html www/index.html
          fi

          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: "sman-driver-app",
              version: "1.0.0",
              dependencies: {
                "@capacitor/core": "6.2.0",
                "@capacitor/android": "6.2.0"
              },
              devDependencies: {
                "@capacitor/cli": "6.2.0"
              }
            }, null, 2));
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.smanhehia.driver",
              appName: "كابتن سمان ههيا",
              webDir: "www",
              server: {
                androidScheme: "https",
                cleartext: true
              },
              android: {
                allowMixedContent: true
              }
            }, null, 2));
          '

      - name: Install Dependencies & Add Android
        run: |
          rm -rf node_modules package-lock.json android
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000
          npm install
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          NEW_VER_CODE=$((100 + ${{ github.run_number }}))
          echo "APP_VER_CODE=${NEW_VER_CODE}" >> $GITHUB_ENV
          echo "APP_VER_NAME=1.${NEW_VER_CODE}" >> $GITHUB_ENV

          sed -i -E "s/versionCode [0-9]+/versionCode ${NEW_VER_CODE}/g" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.${NEW_VER_CODE}\"/g" android/app/build.gradle

          cp -f driver-debug.keystore android/app/debug.keystore
          node -e '
            const fs = require("fs");
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            if (!gradle.includes("signingConfigs")) {
              const signingBlock = `    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n    buildTypes {`;
              gradle = gradle.replace("buildTypes {", signingBlock);
              gradle = gradle.replace(/buildTypes\s*\{[\s\S]*?release\s*\{/, (m) => m.replace("release {", "debug {\n            signingConfig signingConfigs.debug\n        }\n        release {"));
              fs.writeFileSync(gradlePath, gradle, "utf8");
            }
          '

          echo "=== Verified build.gradle Versions ==="
          grep -E "versionCode|versionName" android/app/build.gradle || true
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          cat << 'EOG' >> android/gradle.properties
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          EOG

      - name: Inject Microphone Permissions & Native Auto-Update Bridge
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = `
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            `;
            if (!xml.includes("RECORD_AUDIO")) {
              xml = xml.replace("<application", perms + "\n    <application");
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '

          mkdir -p android/app/src/main/java/com/smanhehia/driver
          cat << 'EOF' > android/app/src/main/java/com/smanhehia/driver/MainActivity.java
          package com.smanhehia.driver;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          webView.getSettings().setJavaScriptEnabled(true);
                          webView.addJavascriptInterface(new SmanDriverBridge(this), "SmanDriverNative");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static class SmanDriverBridge {
                  private final MainActivity activity;
                  private static final String APP_VERSION_CODE_STR = "__APP_VERSION_CODE__";
                  private static final String APP_VERSION_NAME = "__APP_VERSION_NAME__";
                  private static final String GITHUB_REPO = "__GITHUB_REPO__";

                  public SmanDriverBridge(MainActivity activity) {
                      this.activity = activity;
                  }

                  @JavascriptInterface
                  public void savePermanentPref(String key, String value) {
                      try {
                          if (key == null || key.isEmpty()) return;
                          activity.getSharedPreferences("sman_driver_prefs", Context.MODE_PRIVATE)
                              .edit()
                              .putString(key, value != null ? value : "")
                              .apply();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }

                  @JavascriptInterface
                  public String getPermanentPref(String key) {
                      try {
                          if (key == null || key.isEmpty()) return "";
                          return activity.getSharedPreferences("sman_driver_prefs", Context.MODE_PRIVATE)
                              .getString(key, "");
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public int getAppVersionCode() {
                      try {
                          return Integer.parseInt(APP_VERSION_CODE_STR.trim());
                      } catch (Exception e) {
                          return 0;
                      }
                  }

                  @JavascriptInterface
                  public String getAppVersionName() {
                      return APP_VERSION_NAME;
                  }

                  @JavascriptInterface
                  public String getGitHubRepo() {
                      return GITHUB_REPO;
                  }

                  @JavascriptInterface
                  public boolean openExternalUrl(final String url) {
                      try {
                          if (url == null || url.trim().isEmpty()) return false;
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url.trim()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          activity.startActivity(intent);
                          return true;
                      } catch (Exception e) {
                          e.printStackTrace();
                          return false;
                      }
                  }
              }
          }
          EOF

          sed -i "s|__APP_VERSION_CODE__|${APP_VER_CODE}|g" android/app/src/main/java/com/smanhehia/driver/MainActivity.java
          sed -i "s|__APP_VERSION_NAME__|${APP_VER_NAME}|g" android/app/src/main/java/com/smanhehia/driver/MainActivity.java
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" android/app/src/main/java/com/smanhehia/driver/MainActivity.java

      - name: Build Driver Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sman-Driver-APK.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sman-Hehia-Driver-APK
          path: Sman-Driver-APK.apk

      - name: Publish Latest Driver APK Release (Auto-Update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "تحديث جديد لتطبيق المندوب")
          RELEASE_NOTES=$(printf "VERSION_CODE:%s\nالإصدار: v%s\nالتفاصيل: %s" "${APP_VER_CODE}" "${APP_VER_NAME}" "${COMMIT_MSG}")
          if gh release view latest-driver >/dev/null 2>&1; then
            gh release edit latest-driver \
              --title "كابتن سمان ههيا - الإصدار v${APP_VER_NAME}" \
              --notes "$RELEASE_NOTES"
            gh release upload latest-driver Sman-Driver-APK.apk --clobber
          else
            gh release create latest-driver Sman-Driver-APK.apk \
              --title "كابتن سمان ههيا - الإصدار v${APP_VER_NAME}" \
              --notes "$RELEASE_NOTES"
          fi
